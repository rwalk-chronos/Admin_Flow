name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adminflow_test
          POSTGRES_USER: adminflow
          POSTGRES_PASSWORD: adminflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adminflow -d adminflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://adminflow:adminflow@localhost:5432/adminflow_test
      ADMINFLOW_RUN_DATABASE_INTEGRATION_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest
