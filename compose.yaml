services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adminflow}
      POSTGRES_USER: ${POSTGRES_USER:-adminflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminflow}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - adminflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-adminflow}:${POSTGRES_PASSWORD:-adminflow}@postgres:5432/${POSTGRES_DB:-adminflow}
      ARTIFACT_STORAGE_PATH: ${ARTIFACT_STORAGE_PATH:-/data/artifacts}
    ports:
      - "8000:8000"
    volumes:
      - adminflow_artifacts:${ARTIFACT_STORAGE_PATH:-/data/artifacts}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  adminflow_postgres:
  adminflow_artifacts:
